# Light CI, manual dispatch only (no push/PR auto triggers by owner's
# choice).  Heavy kernel builds live in kernel-build.yml for the same reason:
# a ThinLTO GKI build takes hours.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lib.sh variables are consumed by the scripts that source it, so the
      # SC2034 warnings it emits are expected; warning severity keeps the gate
      # on real issues.
      - run: shellcheck -S warning dash/scripts/*.sh

  # Replay the patch series against the pinned AOSP tag.  This is the core
  # invariant of the repo: every build source tree is regenerated from
  # shallow-clone + series, so a series that no longer applies is a broken
  # build.  apply-patches needs BakaSU (KSU driver symlink), susfs4ksu
  # (SUSFS files are installed from the pinned submodule) and nomount
  # (fs/nomount symlink; the pin is verified at apply time).
  patch-series:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Init BakaSU, susfs4ksu and nomount submodules
        run: git submodule update --init --depth 1 BakaSU third_party/susfs4ksu third_party/nomount
      - name: Sync pinned AOSP and apply patch series
        run: make -C dash source patches
