# Full kernel build, manual dispatch only: a ThinLTO GKI build takes 1.5-3h
# on the 4-core hosted runner; the memory-expansion step below covers the
# ThinLTO link stage's RAM spikes (measured setup, see storage-ram-test.yml).
# Boot packaging and finalize.sh stay local on purpose: they need the
# gitignored stock boot_b.img and vendor module manifest.
name: kernel-build

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast test build: disable ThinLTO (compile speed over optimization); artifacts are NOT for flashing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # apply-patches.sh symlinks BakaSU/kernel as drivers/kernelsu,
      # installs the SUSFS files from the pinned susfs4ksu submodule and
      # symlinks third_party/nomount as fs/nomount; no other submodule
      # takes part in the kernel build.
      - name: Init kernel build submodules
        run: git submodule update --init --depth 1 BakaSU third_party/susfs4ksu third_party/nomount

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          make -C dash deps

      # ThinLTO link can approach the 16GB RAM limit; extend it the way
      # storage-ram-test validated on kernel 7.0.0-1019-azure (run 44809707378):
      # 16G swapfile + 8G zram with active=zstd + zswap(zstd) -> 16G RAM plus
      # ~24G swap/zram.  No disk cleanup needed: the runner has ~87GB free.
      - name: Expand memory (swap 16G + zram 8G zstd + zswap)
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          if sudo modprobe zram; then
            # 2026-11-21: runner images now pre-configure zram0 via
            # zram-generator; with a disksize set, comp_algorithm/disksize
            # writes return EBUSY.  Swap off and reset (disksize -> 0)
            # before reconfiguring.  Best-effort, like the modprobe gate.
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 1 | sudo tee /sys/block/zram0/reset >/dev/null 2>&1 || true
            echo zstd | sudo tee /sys/block/zram0/comp_algorithm >/dev/null 2>&1 || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null 2>&1 || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 && \
              sudo swapon -p 100 /dev/zram0 || true
          fi
          sudo modprobe zsmalloc 2>/dev/null || true
          if sudo modprobe zswap 2>/dev/null || [[ -d /sys/module/zswap ]]; then
            echo zstd | sudo tee /sys/module/zswap/parameters/compressor >/dev/null 2>&1 || true
            [[ -f /sys/module/zswap/parameters/zpool ]] \
              && echo zsmalloc | sudo tee /sys/module/zswap/parameters/zpool >/dev/null 2>&1 || true
            echo Y | sudo tee /sys/module/zswap/parameters/enabled >/dev/null 2>&1 || true
          fi
          free -h
          swapon --show

      # ~1GB sparse clang checkout; keyed on versions.env so a pin bump
      # invalidates it.  fetch-toolchain.sh no-ops when the cache hit.
      - name: Restore clang toolchain cache
        uses: actions/cache@v4
        with:
          path: dash/toolchains/clang-prebuilt
          key: clang-${{ hashFiles('dash/versions.env') }}

      - name: Build Image (source → patches → config → build)
        env:
          FAST: ${{ inputs.fast == true && '1' || '0' }}
        run: make -C dash build

      - name: Smoke-check kernel image
        run: |
          version="$(strings dash/out/artifacts/Image \
            | sed -n 's/^Linux version \(.*\)/\1/p' | head -1)"
          echo "kernel: ${version:-NOT FOUND}"
          [[ -n "$version" ]]

      - name: Collect artifacts
        run: |
          mkdir -p upload
          cp dash/out/artifacts/Image dash/out/artifacts/Image.lz4 \
             dash/out/artifacts/System.map dash/out/artifacts/config upload/
          cp dash/out/dash/vmlinux upload/
          gzip -9 -c dash/out/dash/build.log > upload/build.log.gz
          ls -lh upload/

      - uses: actions/upload-artifact@v4
        with:
          name: dash-kernel-${{ inputs.fast == true && 'fast-' || '' }}${{ github.sha }}
          path: upload/
          retention-days: 14
          if-no-files-found: error
