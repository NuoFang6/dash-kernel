# Production kernel build, manual dispatch only. Default (fast=false) is
# Full LTO + MLGO + ACK AutoFDO + A720 tune. A Full LTO build on the 4-core
# hosted runner can take hours; the memory-expansion step below covers the
# link stage's RAM spikes (measured setup, see storage-ram-test.yml).
# fast=true keeps the old NoLTO test path and never publishes a release.
name: kernel-build

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast test build: NoLTO (compile speed over optimization); artifacts are NOT for flashing"
        required: false
        default: false
        type: boolean
      perf:
        description: "Experimental performance build (DASH_PERF=1); never publishes a release"
        required: false
        default: false
        type: boolean
      release:
        description: "Create/update a GitHub Release with the AnyKernel3 package and KSU module"
        required: false
        default: true
        type: boolean
      tag:
        description: "Release tag"
        required: false
        default: "dash-6.6.143-prod"
        type: string

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # apply-patches.sh symlinks BakaSU/kernel as drivers/kernelsu,
      # installs the SUSFS files from the pinned susfs4ksu submodule and
      # symlinks third_party/nomount as fs/nomount; no other submodule
      # takes part in the kernel build.
      - name: Init kernel build submodules
        run: git submodule update --init --depth 1 BakaSU third_party/susfs4ksu third_party/nomount third_party/sukisu-patch

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          make -C dash deps

      # ThinLTO link can approach the 16GB RAM limit; extend it the way
      # storage-ram-test validated on kernel 7.0.0-1019-azure (run 44809707378):
      # 16G swapfile + 8G zram with active=zstd + zswap(zstd) -> 16G RAM plus
      # ~24G swap/zram.  No disk cleanup needed: the runner has ~87GB free.
      - name: Expand memory (swap 16G + zram 8G zstd + zswap)
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile || \
            sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          if sudo modprobe zram; then
            # 2026-11-21: runner images now pre-configure zram0 via
            # zram-generator; with a disksize set, comp_algorithm/disksize
            # writes return EBUSY.  Swap off and reset (disksize -> 0)
            # before reconfiguring.  Best-effort, like the modprobe gate.
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 1 | sudo tee /sys/block/zram0/reset >/dev/null 2>&1 || true
            echo zstd | sudo tee /sys/block/zram0/comp_algorithm >/dev/null 2>&1 || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null 2>&1 || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 && \
              sudo swapon -p 100 /dev/zram0 || true
          fi
          sudo modprobe zsmalloc 2>/dev/null || true
          if sudo modprobe zswap 2>/dev/null || [[ -d /sys/module/zswap ]]; then
            echo zstd | sudo tee /sys/module/zswap/parameters/compressor >/dev/null 2>&1 || true
            [[ -f /sys/module/zswap/parameters/zpool ]] \
              && echo zsmalloc | sudo tee /sys/module/zswap/parameters/zpool >/dev/null 2>&1 || true
            echo Y | sudo tee /sys/module/zswap/parameters/enabled >/dev/null 2>&1 || true
          fi
          free -h
          swapon --show

      # ~1GB sparse clang checkout; keyed on CLANG_VERSION only, so kernel /
      # BakaSU / SUSFS pin bumps in versions.env do NOT evict the toolchain.
      # fetch-toolchain.sh no-ops when the cache hit (TOOLCHAIN_DIR/bin/clang
      # already executable).  restore-keys falls back to the newest clang-*
      # entry so even a version bump reuses the git clone skeleton.
      - name: Compute toolchain cache key
        id: toolcache
        run: |
          ver="$(grep -E '^CLANG_VERSION=' dash/versions.env | cut -d= -f2 | tr -d '[:space:]')"
          echo "key=clang-${ver}" >> "$GITHUB_OUTPUT"
          echo "cache key: clang-${ver}"

      - name: Restore clang toolchain cache
        uses: actions/cache@v4
        with:
          path: dash/toolchains/clang-prebuilt
          key: ${{ steps.toolcache.outputs.key }}
          restore-keys: clang-

      - name: Build Image (source → patches → config → build)
        env:
          FAST: ${{ inputs.fast == true && '1' || '0' }}
          DASH_PERF: ${{ inputs.perf == true && '1' || '0' }}
        run: make -C dash build

      - name: Smoke-check kernel image
        run: |
          version="$(strings dash/out/artifacts/Image \
            | sed -n 's/^Linux version \(.*\)/\1/p' | head -1)"
          echo "kernel: ${version:-NOT FOUND}"
          [[ -n "$version" ]]

      # Collect kernel artifacts AND everything needed to debug the build
      # (final prepared config, patch series, feature/config inputs, tree
      # provenance) BEFORE the flashable-size gate, so an oversize or failed
      # build still uploads its evidence.  Every copy is best-effort: a
      # partial build must not make collection itself fail.
      - name: Collect artifacts and debug inputs
        if: always()
        run: |
          mkdir -p upload
          cp dash/out/artifacts/Image dash/out/artifacts/Image.lz4 \
             dash/out/artifacts/System.map dash/out/artifacts/config \
             upload/ || true
          cp dash/out/dash/vmlinux upload/ || true
          cp dash/out/dash/vmlinux.symvers upload/vmlinux.symvers || true
          # Config actually in force after patches + configure + kbuild fixes
          cp dash/out/dash/.config upload/final-config || true
          gzip -9 -c dash/out/dash/build.log > upload/build.log.gz || true
          # Patch series / configs / pins / scripts as used for this build
          (cd dash && tar czf ../upload/build-inputs.tar.gz \
            patches configs versions.env scripts/configure.sh \
            scripts/build.sh scripts/apply-patches.sh) || true
          {
            echo "=== build time (UTC) ==="; date -u +%FT%TZ
            echo "=== versions.env (pins) ==="; cat dash/versions.env
            echo "=== AOSP tree head ==="; git -C dash/src/aosp/common log --oneline -3
            echo "=== AOSP tree applied state (git status --short, first 80) ==="
            git -C dash/src/aosp/common status --short | head -80
            echo "=== clang ==="
            ver="$(grep -E '^CLANG_VERSION=' dash/versions.env | cut -d= -f2)"
            dash/toolchains/clang-prebuilt/clang-"${ver}"/bin/clang --version | head -1 || true
            echo "=== image sizes ==="
            ls -l dash/out/artifacts/Image dash/out/artifacts/Image.lz4 2>/dev/null || true
          } > upload/build-info.txt
          ls -lh upload/

      # The flashable kernel is the lz4 image repacked into the stock boot.img
      # (scripts/repack-boot.py): 1 header page + kernel + page-aligned vbmeta
      # + 64-byte AVBf footer, all within the 64MiB boot partition.  Budget:
      # 67108864 - 4096 (header page) - 4096 (worst-case alignment) - 2432
      # (stock vbmeta size, measured on boot_b.img) - 64 (AVBf) = 67098176.
      # Oversize does NOT delete anything: the artifact above is already
      # collected and still uploads (always()), the workflow just fails so
      # nobody mistakes the result for flashable.
      - name: Check flashable size (boot 64MiB limit)
        if: always()
        run: |
          if [ ! -f dash/out/artifacts/Image.lz4 ]; then
            echo "Image.lz4 missing (build failed earlier); size check skipped"
            exit 0
          fi
          max=67098176
          size="$(stat -c%s dash/out/artifacts/Image.lz4)"
          echo "Image.lz4: ${size} bytes / flashable limit: ${max} bytes"
          if [ "${size}" -gt "${max}" ]; then
            echo "::error::Image.lz4 (${size} B) exceeds the flashable kernel limit (${max} B); a boot.img that fits the 64MiB partition cannot contain it"
            exit 1
          fi

      - name: Package KSU module and AnyKernel3
        if: success()
        run: |
          set -euo pipefail
          mod=dash/modules/dash_art_tune
          ver="$(sed -n 's/^version=//p' "$mod/module.prop" | head -1)"
          test -n "$ver"
          mkdir -p upload/release
          (cd "$mod" && zip -r -X "$GITHUB_WORKSPACE/upload/release/dash_art_tune-${ver}.zip" . -x '*.DS_Store')
          anykernel3="$(mktemp -d)"
          cp -a third_party/sukisu-patch/AnyKernel3/. "$anykernel3"/
          cp dash/ak3/anykernel.sh "$anykernel3/anykernel.sh"
          cp dash/out/artifacts/Image "$anykernel3/Image"
          cp -a "$mod" "$anykernel3/module"
          (cd "$anykernel3" && zip -r -X "$GITHUB_WORKSPACE/upload/release/dash_art_tune-AnyKernel3-${ver}.zip" . -x '*.DS_Store')
          cp dash/out/artifacts/Image dash/out/artifacts/Image.lz4 upload/release/
          (cd upload/release && rm -f SHA256SUMS && sha256sum * > SHA256SUMS)
          ls -lh upload/release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dash-kernel-${{ inputs.fast == true && 'fast-' || '' }}${{ inputs.perf == true && 'perf-' || '' }}${{ github.sha }}
          path: upload/
          retention-days: 14
          if-no-files-found: error

      - name: Publish production release
        if: success() && inputs.release && inputs.fast != true && inputs.perf != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            内核刷入包为 AnyKernel3：`dash_art_tune-AnyKernel3-*.zip`。
            dash 的 boot 是 kernel-only 镜像（ramdisk_size=0），安装器只替换内核，
            不写 init_boot / vendor_boot；调优模块见 `dash_art_tune-*.zip`。
            镜像文件：`Image`、`Image.lz4`；校验见 `SHA256SUMS`。
          files: upload/release/*
          generate_release_notes: true
          make_latest: true
